<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>G Crest Colourer</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#e9e9ec;
    overscroll-behavior:none;
  }
  .app{display:flex;flex-direction:column;height:100%;max-width:1000px;margin:0 auto;}
  .stage-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:14px;min-height:0;overflow:hidden;container-type:size;
  }
  #stage{
    width:min(100cqw, calc(100cqh * 1.0884));
    aspect-ratio:1970/1810;
    border-radius:14px;
    box-shadow:0 4px 20px rgba(0,0,0,0.18);
    overflow:hidden;position:relative;background:#000;
  }
  #stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .controls{
    background:#fff;border-top:1px solid #ddd;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    max-height:52vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:12px;
  }
  .grid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media (min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
  .card{
    background:#f6f6f8;border-radius:12px;padding:12px 14px;
    display:flex;flex-direction:column;gap:8px;
  }
  .label{
    font-size:13px;font-weight:700;color:#444;text-transform:uppercase;
    letter-spacing:0.03em;display:flex;justify-content:space-between;
  }
  .label .val{color:#007aff;}
  .row{display:flex;align-items:center;gap:8px;}
  .swatches{display:flex;gap:7px;flex:1;flex-wrap:wrap;}
  .swatch{
    width:30px;height:30px;border-radius:50%;padding:0;flex-shrink:0;
    border:2px solid rgba(0,0,0,0.18);
  }
  .swatch.selected{border:3px solid #007aff;transform:scale(1.12);}
  .color-input{
    -webkit-appearance:none;appearance:none;width:36px;height:36px;border:none;
    border-radius:50%;padding:0;background:none;flex-shrink:0;
  }
  .color-input::-webkit-color-swatch-wrapper{padding:0;}
  .color-input::-webkit-color-swatch{border-radius:50%;border:2px solid rgba(0,0,0,0.18);}
  input[type="range"]{width:100%;height:34px;-webkit-appearance:none;appearance:none;background:transparent;margin:0;}
  input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#d4d4d8;}
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;
    background:#007aff;margin-top:-11px;box-shadow:0 1px 4px rgba(0,0,0,0.3);
  }
  #saveBtn{
    width:100%;padding:16px;font-size:18px;font-weight:700;color:#fff;
    background:#007aff;border:none;border-radius:12px;
  }
  #saveBtn:active{background:#005ecb;}
  #saveBtn:disabled{opacity:0.6;}
  #hint{text-align:center;font-size:13px;color:#777;min-height:16px;}
  #outputWrap{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);
    z-index:10;overflow:auto;padding:20px;text-align:center;
  }
  #outputWrap.show{display:block;}
  #outputMsg{color:#fff;font-size:15px;margin:0 0 14px;}
  #outputImg{max-width:100%;border-radius:10px;}
  #closeOutput{
    margin-top:16px;padding:12px 24px;border-radius:10px;border:none;
    background:#fff;font-size:16px;font-weight:600;
  }
</style>
</head>

<script>
(function(){
  var VB = {x:200, y:-40, w:1970, h:1810};
  var WREATH_C = [1184.0, 970.5];
  var G_C = [1184.0, 902.5];

  var stage = document.getElementById('stage');
  var svg = document.getElementById('logoSvg');
  var gEl = document.getElementById('g-shape');
  var laurelsEl = document.getElementById('laurels');
  var starsEl = document.getElementById('stars');
  var starEls = Array.prototype.slice.call(document.querySelectorAll('.star'));

  function scaleAbout(cx, cy, s){
    return 'translate(' + cx + ' ' + cy + ') scale(' + s + ') translate(' + (-cx) + ' ' + (-cy) + ')';
  }

  var presets = ['#ffffff','#000000','#ffd700','#c8102e','#000080','#2e8b57','#87ceeb'];

  var setters = {
    bg:      function(c){ stage.style.background = c; },
    stars:   function(c){ starsEl.setAttribute('fill', c); },
    laurels: function(c){ laurelsEl.setAttribute('fill', c); },
    g:       function(c){ gEl.setAttribute('fill', c); }
  };
  var colours = {bg:'#000000', stars:'#ffffff', laurels:'#ffffff', g:'#ffffff'};

  document.querySelectorAll('.card').forEach(function(card){
    var key = card.getAttribute('data-el');
    var wrap = card.querySelector('.swatches');
    var picker = card.querySelector('.color-input');
    function apply(c){
      colours[key] = c;
      setters[key](c);
      picker.value = c;
      wrap.querySelectorAll('.swatch').forEach(function(sw){
        sw.classList.toggle('selected', sw.dataset.color === c.toLowerCase());
      });
    }
    presets.forEach(function(c){
      var b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c;
      b.dataset.color = c;
      b.setAttribute('aria-label', c);
      b.addEventListener('click', function(){ apply(c); });
      wrap.appendChild(b);
    });
    picker.addEventListener('input', function(){ apply(picker.value); });
    apply(colours[key]);
  });

  // Sizes. Stars scale about their own centre (positions stay put),
  // laurels scale together about the wreath centre, G about its own centre.
  var starsSlider = document.getElementById('starsSize');
  var laurelsSlider = document.getElementById('laurelsSize');
  var gSlider = document.getElementById('gSize');

  starsSlider.addEventListener('input', function(){
    var s = starsSlider.value / 100;
    document.getElementById('starsVal').textContent = starsSlider.value + '%';
    starEls.forEach(function(el){
      el.setAttribute('transform', scaleAbout(+el.dataset.cx, +el.dataset.cy, s));
    });
  });
  laurelsSlider.addEventListener('input', function(){
    var s = laurelsSlider.value / 100;
    document.getElementById('laurelsVal').textContent = laurelsSlider.value + '%';
    laurelsEl.setAttribute('transform', scaleAbout(WREATH_C[0], WREATH_C[1], s));
  });
  gSlider.addEventListener('input', function(){
    var s = gSlider.value / 100;
    document.getElementById('gVal').textContent = gSlider.value + '%';
    gEl.setAttribute('transform', scaleAbout(G_C[0], G_C[1], s));
  });

  // Export
  var saveBtn = document.getElementById('saveBtn');
  var hint = document.getElementById('hint');
  var outputWrap = document.getElementById('outputWrap');
  var outputImg = document.getElementById('outputImg');

  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  saveBtn.addEventListener('click', function(){
    hint.textContent = 'Rendering…';
    saveBtn.disabled = true;

    var OUT_W = 2400;
    var OUT_H = Math.round(OUT_W * VB.h / VB.w);

    var clone = svg.cloneNode(true);
    clone.setAttribute('width', OUT_W);
    clone.setAttribute('height', OUT_H);
    var xml = new XMLSerializer().serializeToString(clone);
    var url = URL.createObjectURL(new Blob([xml], {type:'image/svg+xml;charset=utf-8'}));

    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      canvas.width = OUT_W; canvas.height = OUT_H;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = colours.bg;
      ctx.fillRect(0, 0, OUT_W, OUT_H);
      ctx.drawImage(img, 0, 0, OUT_W, OUT_H);
      URL.revokeObjectURL(url);
      canvas.toBlob(function(blob){
        var jpegUrl = URL.createObjectURL(blob);
        if(isIOS()){
          outputImg.src = jpegUrl;
          outputWrap.classList.add('show');
          hint.textContent = '';
        } else {
          var a = document.createElement('a');
          a.href = jpegUrl; a.download = 'g-crest.jpg';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          hint.textContent = 'Saved.';
        }
        saveBtn.disabled = false;
      }, 'image/jpeg', 0.95);
    };
    img.onerror = function(){
      hint.textContent = 'Something went wrong rendering the image.';
      saveBtn.disabled = false;
    };
    img.src = url;
  });

  document.getElementById('closeOutput').addEventListener('click', function(){
    outputWrap.classList.remove('show');
  });
})();
</script>
</body>
</html>
